# Preparation only: this workflow has no Cloudflare credentials or deploy step.
name: Verify deployment bundle
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests, build and output checks
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: quickbill-static-bundle
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
